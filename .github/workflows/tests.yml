name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            plotly: "plotly>=6,<8"
            pandas: "pandas>=3,<4"
            numpy: "numpy>=2,<3"
            gradio: "gradio>=6,<7"
            pytest: "pytest>=8,<10"
          - python: "3.13"
            plotly: "plotly==5.24.1"
            pandas: "pandas==2.3.3"
            numpy: "numpy==2.1.3"
            gradio: "gradio==6.26.0"
            pytest: "pytest==8.4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip install "${{ matrix.plotly }}" "${{ matrix.pandas }}" "${{ matrix.numpy }}" "${{ matrix.gradio }}" "${{ matrix.pytest }}"
      - name: Run offline test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -m "not network"
      - name: Check Kaggle notebook and safe Git checkout
        run: python -B tools/verify_notebook.py
      - name: Check Gradio HTTP queue and downloads
        run: python -B tools/verify_gradio.py
