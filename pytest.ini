[pytest]
markers =
    network: hits the live INTERMAGNET / Kyoto WDC endpoints
filterwarnings =
    ignore::DeprecationWarning
    # The DSL escalates numpy's non-fatal divide/overflow warnings into
    # formula_eval_error itself, so they are expected rather than surprising.
    ignore:divide by zero encountered:RuntimeWarning
    ignore:overflow encountered:RuntimeWarning
